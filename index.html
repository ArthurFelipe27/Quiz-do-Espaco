<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ===[TORNA O SITE RESPONSIVO EM DISPOSITIVOS MÓVEIS]=== -->
  <link rel="shortcut icon" href="img/shortcutIcon.png"> <!-- ===[ÍCONE DE ABA DO NAVEGADOR]=== -->
  <title>Login Espacial</title> <!-- ===[TÍTULO DA ABA DO NAVEGADOR]=== -->
  <link rel="stylesheet" href="css/style.css"> <!-- ===[IMPORTAÇÃO DO ARQUIVO DE ESTILOS CSS]=== -->
</head>

<body>
  <canvas id="starsCanvas"></canvas> <!-- ===[CANVAS PARA ANIMAÇÃO DAS ESTRELAS DE FUNDO]=== -->
  <canvas id="warpCanvas" style="display: none;"></canvas> <!-- ===[CANVAS PARA EFEITO DE TÚNEL]=== -->

  <div class="login-container">
    <h1 id="title">🌌 Bem-vindo ao Espaço</h1> <!-- ===[TÍTULO PRINCIPAL DO LOGIN]=== -->
    <img class="astronaut" src="img/astronauta.png" alt="Astronauta flutuando">
    <!-- ===[IMAGEM ILUSTRATIVA DO LOGIN]=== -->

    <form id="loginForm"> <!-- ===[FORMULÁRIO DE LOGIN]=== -->

      <!-- ===[CAMPO DE TEXTO PARA O USUÁRIO]=== -->
      <label for="username">Usuário:</label>
      <input type="text" id="username" placeholder="Digite seu usuário..." required>

      <!-- ===[BOTÃO QUE LEVA À PÁGINA DE CRÉDITOS]=== -->
      <button type="submit">Entrar</button> <!-- ===[BOTÃO DE ENVIO DO LOGIN]=== -->

      <a href="creditos.html" class="botao-creditos">👩‍🚀 Créditos</a>
    </form>

    <p id="errorMsg"></p> <!-- ===[ÁREA PARA MENSAGENS DE ERRO]=== -->
  </div>


  <button id="toggleTheme" class="botao-tema">🌓 Alternar Tema</button>
  <!-- ===[BOTÃO PARA TROCAR TEMA CLARO/ESCURO]=== -->

  <script>
    /*--===[INICIALIZAÇÃO E LOGIN]===--*/
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (username === "") {
        errorMsg.textContent = "Por favor, digite seu nome!";
        return;
      }

      localStorage.setItem("nomeJogador", username);
      triggerWarpEffect();

      setTimeout(() => {
        window.location.href = "quiz.html";
      }, 2000);
    });


    /*--===[FUNDO ESTRELADO ANIMADO]===--*/
    function createStarBackground() {
      const canvas = document.getElementById("starsCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let estrelas = []; // ===[ARRAY PARA ARMAZENAR AS ESTRELAS]===
      for (let i = 0; i < 100; i++) {
        estrelas.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2,
          velocity: Math.random() * 0.5
        });
      }

      function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        estrelas.forEach(estrela => {
          ctx.fillStyle = "white";
          ctx.beginPath();
          ctx.arc(estrela.x, estrela.y, estrela.size, 0, Math.PI * 2);
          ctx.fill();
          estrela.y += estrela.velocity;

          if (estrela.y > canvas.height) {
            estrela.y = 0;
            estrela.x = Math.random() * canvas.width;
          }
        });

        requestAnimationFrame(animateStars); // ===[LOOP ANIMADO PARA O FUNDO]===
      }

      animateStars();
    }

    /*--===[EFEITO DE TÚNEL INTERGALÁCTICO]===--*/
    function triggerWarpEffect() {
      const canvas = document.getElementById("warpCanvas");
      canvas.style.display = "block"; // ===[MOSTRA O CANVAS DO TÚNEL]===
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let linhas = []; // ===[ARRAY PARA RISCOS DO TÚNEL]===
      for (let i = 0; i < 50; i++) {
        linhas.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 50 + 50,
          velocity: Math.random() * 5 + 2,
          alpha: 1
        });
      }

      function animateWarp() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height); // ===[FUNDO SEMI-TRANSPARENTE PARA TRAIL]===

        linhas.forEach((linha, index) => {
          ctx.strokeStyle = `rgba(255, 255, 255, ${linha.alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(linha.x, linha.y);
          ctx.lineTo(linha.x, linha.y - linha.length);
          ctx.stroke();

          linha.y -= linha.velocity;
          linha.alpha -= 0.02;

          if (linha.alpha <= 0) {
            linhas.splice(index, 1); // ===[REMOVE LINHAS INVISÍVEIS PARA ECONOMIZAR PROCESSAMENTO]===
          }
        });

        if (linhas.length > 0) {
          requestAnimationFrame(animateWarp); // ===[CONTINUA ANIMAÇÃO ENQUANTO TIVER LINHAS]===
        }
      }

      animateWarp();
    }
  </script>

  <script src="js/tema.js"></script> <!-- ===[SCRIPT PARA GERENCIAR O TEMA CLARO/ESCURO]=== -->
</body>

</html>
