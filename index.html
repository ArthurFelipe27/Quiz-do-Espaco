<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon"
    href="https://raw.githubusercontent.com/arthurfelipe27/projeto-quizinterativo/main/img/shortcutIcon.png"
    type="image/png">
  <title>Quiz do Espaço 🚀</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <!-- Link para o arquivo CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Canvas para o fundo animado de estrelas -->
  <canvas id="starsCanvas"></canvas>

  <!-- Botão de alternância de tema claro/escuro -->
  <button id="toggleThemeBtn" class="botao-tema">🌓 Alternar Tema</button>

  <!-- Astronauta animado -->
  <img src="https://raw.githubusercontent.com/arthurfelipe27/projeto-quizinterativo/main/img/astronauta.png"
    alt="Astronauta flutuando" class="astronaut">

  <!-- Container principal da aplicação -->
  <main id="app">

    <!-- TELA DE LOGIN -->
    <section id="login-view" class="view">
      <h1 id="title">🌌 Bem-vindo ao Quiz do Espaço</h1>
      <form id="loginForm">
        <label for="username">Usuário:</label>
        <input type="text" id="username" placeholder="Digite seu nome..." required>

        <!-- Seleção de Dificuldade -->
        <label>Escolha a dificuldade:</label>
        <div id="difficulty-selection" class="difficulty-buttons">
          <button type="button" class="btn-difficulty" data-difficulty="facil">Fácil</button>
          <button type="button" class="btn-difficulty" data-difficulty="medio">Médio</button>
          <button type="button" class="btn-difficulty" data-difficulty="dificil">Difícil</button>
        </div>

        <p id="errorMsg"></p>
        <button type="submit" id="login-btn" disabled>Entrar</button>
      </form>
      <button id="creditos-btn-login">👩‍🚀 Créditos</button>
    </section>

    <!-- TELA DO QUIZ -->
    <section id="quiz-view" class="view">
      <h1 id="quiz-title">Quiz do Espaço</h1>
      <div id="player-name" class="player-name"></div>
      <div id="timer"></div>
      <p id="question" class="pergunta"></p>
      <div id="answers" role="group" aria-label="Opções de resposta"></div>
      <p id="feedback" aria-live="polite"></p>
      <div id="info-extra" aria-live="polite"></div>
      <p id="pontos-usuario"></p>
      <div class="quiz-botoes">
        <button id="voltar-btn">Voltar</button>
        <button id="pular-btn">Pular Pergunta</button>
        <button id="reset-btn">Resetar Quiz</button>
        <button id="next-btn" disabled>Próxima Pergunta</button>
      </div>
    </section>

    <!-- TELA DE RESULTADO -->
    <section id="resultado-view" class="view">
      <h1 class="titulo-espacial">Resultado Final</h1>
      <p id="resultado-texto" aria-live="polite"></p>
      <section>
        <h2>🏆 Ranking Global (Top 5)</h2>
        <ol id="lista-ranking"></ol>
      </section>
      <button id="jogar-novamente-btn">Jogar Novamente</button>
      <!-- O botão de reiniciar ranking foi removido da lógica (e escondido), 
           pois o ranking agora é global e não deve ser apagado por um usuário. -->
      <button id="reiniciar-ranking-btn" style="display: none;">Reiniciar Ranking</button>
    </section>

    <!-- TELA DE CRÉDITOS -->
    <section id="creditos-view" class="view">
      <h1 class="titulo-espacial">Créditos do Projeto</h1>
      <p>Este quiz foi desenvolvido por:</p>
      <ul class="creditos-lista">
        <li><span class="estrela-nome">Luana Pereira</span> – Desenvolvedora Front-end</li>
        <li><span class="estrela-nome">Arthur Felipe</span> – Desenvolvedor Front-end & Designer</li>
      </ul>
      <button id="voltar-inicio-btn">Voltar ao Início</button>
    </section>
  </main>

  <!-- MODAL CUSTOMIZADO -->
  <div id="custom-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <p id="modal-text"></p>
      <div class="modal-buttons">
        <button id="modal-confirm-btn">Confirmar</button>
        <button id="modal-cancel-btn">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- 
    SDKs do Firebase 
    Estes scripts se conectam ao seu banco de dados na nuvem.
  -->
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

  <!-- Link para o arquivo JavaScript externo -->
  <script src="script.js"></script>
</body>

</html>
