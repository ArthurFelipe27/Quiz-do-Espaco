<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/img/shortcutIcon.png">
  <title>Login Espacial</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <canvas id="starsCanvas"></canvas>
  <canvas id="warpCanvas" style="display: none;"></canvas>

  <div class="login-container">
    <h1 id="title">🌌 Bem-vindo ao Espaço</h1>
    <img class="astronaut" src="/img/astronauta.png" alt="Astronauta flutuando">
    <form id="loginForm">
      <label for="username">Usuário:</label>
      <input type="text" id="username" placeholder="Digite seu usuário..." required>

      <label for="password">Senha:</label>
      <input type="password" id="password" placeholder="Digite sua senha..." required>

      <button type="submit">Entrar</button>
    </form>
    <p id="errorMsg"></p>
  </div>

  <a href="/creditos.html" class="botao-creditos">👩‍🚀 Créditos</a>


  <script>
    document.addEventListener("DOMContentLoaded", function () {
      createStarBackground();

      document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");

        if (username.trim() === "" || password.trim() === "") {
          errorMsg.textContent = "Usuário e senha não podem estar vazios!";
        } else if (password !== "12345") {
          errorMsg.textContent = "Senha incorreta! Tente novamente.";
        } else {
          localStorage.setItem("nomeJogador", username);

          // Iniciar túnel de luz
          triggerWarpEffect();

          setTimeout(() => {
            window.location.href = "quiz.html";
          }, 2000);
        }
      });
    });

    /* Criar fundo estrelado animado */
    function createStarBackground() {
      const canvas = document.getElementById("starsCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let stars = [];
      for (let i = 0; i < 100; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2,
          velocity: Math.random() * 0.5
        });
      }

      function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => {
          ctx.fillStyle = "white";
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
          star.y += star.velocity;

          if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
          }
        });

        requestAnimationFrame(animateStars);
      }

      animateStars();
    }

    /* Simulação de túnel de luz intergaláctico */
    function triggerWarpEffect() {
      const canvas = document.getElementById("warpCanvas");
      canvas.style.display = "block";
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let lines = [];
      for (let i = 0; i < 50; i++) {
        lines.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 50 + 50,
          velocity: Math.random() * 5 + 2,
          alpha: 1
        });
      }

      function animateWarp() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        lines.forEach((line, index) => {
          ctx.strokeStyle = `rgba(255, 255, 255, ${line.alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(line.x, line.y);
          ctx.lineTo(line.x, line.y - line.length);
          ctx.stroke();

          line.y -= line.velocity;
          line.alpha -= 0.02;

          if (line.alpha <= 0) {
            lines.splice(index, 1);
          }
        });

        if (lines.length > 0) {
          requestAnimationFrame(animateWarp);
        }
      }

      animateWarp();
    }
  </script>
</body>

</html>
