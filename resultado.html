<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="/img/shortcutIcon.png">
    <title>Quiz do Espaço - Resultado</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
</head>

<body>
  <!-- /*--===[FUNDO ESPACIAL]===--*/ -->
  <div class="bg-space"></div>

  <!-- /*--===[CONTAINER PRINCIPAL DE RESULTADO]===--*/ -->
  <main class="container-fade-in">
    <h1 class="titulo-espacial">Resultado</h1>

    <!-- /*--===[SEÇÃO DE RESULTADO DO JOGADOR]===--*/ -->
    <section aria-labelledby="resultado" style="margin-top: 20px;">
      <p id="resultado" aria-live="polite">
        <span id="texto-resultado"></span>
        <span class="rocket">🚀</span>
      </p>
    </section>

    <!-- /*--===[SEÇÃO DE RANKING]===--*/ -->
    <section style="margin-top: 40px;">
      <h2>🏆 Ranking dos Melhores</h2>
      <ol id="lista-ranking"></ol>
    </section>

    <!-- /*--===[BOTÕES DE AÇÃO]===--*/ -->
    <button id="jogar-novamente" style="margin-top: 20px;">Jogar Novamente</button>
    <button id="reiniciar-ranking" style="margin-top: 10px;">Reiniciar Ranking</button>
  </main>

  <script>
    /*--===[FUNÇÃO PARA ATUALIZAR O RANKING NO LOCALSTORAGE]===--*/
    function atualizarRanking(nome, pontos) {
      const ranking = JSON.parse(localStorage.getItem('ranking')) || [];

      ranking.sort((a, b) => b.pontos - a.pontos);

      if (ranking.length < 5) {
        ranking.push({ nome, pontos });
      } else {
        const ultimo = ranking[ranking.length - 1];
        if (pontos >= ultimo.pontos) {
          ranking[ranking.length - 1] = { nome, pontos };
        } else {
          return;
        }
      }

      ranking.sort((a, b) => b.pontos - a.pontos);
      localStorage.setItem('ranking', JSON.stringify(ranking));
    }

    /*--===[FUNÇÃO PARA EXIBIR O RANKING NA TELA]===--*/
    function exibirRanking() {
      const listaRanking = document.getElementById('lista-ranking');
      const ranking = JSON.parse(localStorage.getItem('ranking')) || [];

      listaRanking.innerHTML = '';
      ranking.forEach((jogador, index) => {
        const item = document.createElement('li');
        item.textContent = `${index + 1}º - ${jogador.nome}: ${jogador.pontos} ponto${jogador.pontos === 1 ? '' : 's'}`;
        listaRanking.appendChild(item);
      });
    }

    /*--===[FUNÇÃO PARA REINICIAR O RANKING]===--*/
    function reiniciarRanking() {
      if (confirm("Tem certeza que deseja apagar todo o ranking?")) {
        localStorage.removeItem('ranking');
        exibirRanking();
      }
    }

    /*--===[INICIALIZAÇÃO AO CARREGAR A PÁGINA]===--*/
    document.addEventListener('DOMContentLoaded', () => {
      const pontos = Number(localStorage.getItem('pontos')) || 0;
      const nome = localStorage.getItem('nomeJogador') || 'Jogador';

      const resultadoEl = document.getElementById('texto-resultado').textContent =
        `${nome}, você fez ${pontos} ponto${pontos === 1 ? '' : 's'}!`;

      atualizarRanking(nome, pontos);
      exibirRanking();

      document.getElementById('jogar-novamente').addEventListener('click', () => {
        localStorage.removeItem('pontos');
        localStorage.removeItem('nomeJogador');
        window.location.href = 'index.html';
      });

      document.getElementById('reiniciar-ranking').addEventListener('click', reiniciarRanking);
    });
  </script>
</body>

</html>
